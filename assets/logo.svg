<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Solid rounded base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Voice waveform bars -->
  <g filter="url(#glow)">
    <rect x="11" y="27" width="4" height="10" rx="2" fill="url(#waveGrad)" />
    <rect x="18" y="20" width="4" height="24" rx="2" fill="url(#waveGrad)" />
    <rect x="25" y="14" width="4" height="36" rx="2" fill="url(#waveGrad)" />
    <rect x="32" y="10" width="4" height="44" rx="2" fill="url(#waveGrad)" />
    <rect x="39" y="17" width="4" height="30" rx="2" fill="url(#waveGrad)" />
    <rect x="46" y="23" width="4" height="18" rx="2" fill="url(#waveGrad)" />
    <rect x="53" y="28" width="4" height="8" rx="2" fill="url(#waveGrad)" />
  </g>
</svg>
